
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" 
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  deps:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    working_dir: /app
    command: pnpm install --frozen-lockfile
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - backend_node_modules:/app/src/backend/node_modules
      - frontend_node_modules:/app/src/frontend/node_modules

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    working_dir: /app/src/backend
    command: pnpm dev
    env_file: .env
    environment:
      CI: "true"
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - backend_node_modules:/app/src/backend/node_modules
      - uploads:/app/uploads
    expose:
      - "3000"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    working_dir: /app/src/frontend
    command: pnpm dev
    environment:
      CI: "true"
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - frontend_node_modules:/app/src/frontend/node_modules
    expose:
      - "5173"

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs
      - uploads:/app/uploads:ro
      - ./scripts/gen-certs.sh:/docker-entrypoint.d/01-gen-certs.sh:ro
    depends_on:
      - frontend
      - backend

volumes:
  pg_data:
  root_node_modules:
  backend_node_modules:
  frontend_node_modules:
  uploads:
